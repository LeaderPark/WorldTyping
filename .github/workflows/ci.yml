# spec: docs/04 §8.1(파이프라인 요지) + docs/00 §7.1(배포 순서 불변식)·§10(테스트 게이트)
#       + docs/07 WT-M0-03
#
# 이 워크플로는 PR·main push마다 검증 게이트를 수행한다. `deploy.yml`은 이 워크플로가
# 성공적으로 끝난 뒤(workflow_run) preview/staging 배포를 트리거한다 — 같은 커밋에
# 대해 CI를 두 번 돌리지 않기 위해 배포 파이프라인은 별도 스텝을 재실행하지 않고
# 이 워크플로의 결론(success)에만 의존한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install / build:data / typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs/02 §10 / docs/07 WT-M0-03 §1: build:data 산출물 신선도 검사.
      # tooling/scripts/build-data.ts는 WT-M1-05에서 생성되므로 그 전까지는 스텝 자체를 건너뛴다.
      - name: build:data freshness check
        if: hashFiles('tooling/scripts/build-data.ts') != ''
        run: |
          pnpm build:data
          git diff --exit-code apps/web/public/data

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # docs/03 §8.5 성능 예산 게이트(entry <170KB gzip) — WT-M5-01. 구성은
      # tooling/ci/size-limit.json(경로 글롭은 그 파일 기준 상대), lazy 라우트 청크
      # (game/multi/rank/passport)는 제외하고 초기 로드분만 잰다.
      - name: Size limit (entry JS budget)
        run: pnpm --filter @wt/web run size-limit

      - name: Install Playwright Chromium (Lighthouse browser)
        run: pnpm --filter @wt/e2e exec playwright install chromium

      # docs/03 §8.5 LCP<2.5s 게이트 — WT-M5-01 세션 특이 조정(lhci 대신 Playwright Chromium
      # 기반 프로그램적 Lighthouse 실행, 모바일 프리셋). 스크립트 자체가 vite preview 기동·대기·
      # 종료를 전담한다(tooling/scripts/check-lighthouse.mjs).
      - name: Lighthouse (mobile, LCP budget)
        run: node tooling/scripts/check-lighthouse.mjs

  # docs/03 §10.2: E2E Chromium은 모든 PR에서 실행(한글 IME 재현은 CDP → Chromium 전용).
  # WebKit/Firefox 프로젝트는 e2e/playwright.config.ts에 정의돼 있으나(E1·E3 매치) 브라우저
  # 설치·실행은 후속으로 이관(WT-M2-08 세션 조정) — 여기서는 chromium만 설치·실행한다.
  # webServer가 apps/web을 프로덕션 빌드 후 vite preview로 띄운다(config 주석: dev StrictMode
  # 이펙트 이중 호출이 입력 컨트롤러 부착을 깨므로 프로덕션 빌드를 대상으로 검증).
  e2e:
    name: e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @wt/e2e exec playwright install --with-deps chromium

      # [WT-M3-08 — E2E 밀폐화] e2e/playwright.config.ts의 webServer가 이제
      # `pnpm --filter @wt/api run e2e:dev`(workers/api/scripts/e2e-dev-server.mjs)를 실행한다 —
      # 이 스크립트 자체가 매 실행마다 전용 persist 디렉터리(.wrangler/e2e-state)를 삭제→재생성
      # →마이그레이션 재적용→wrangler dev 기동까지 전담한다. 신선한 CI 러너든 반복 실행이든
      # 항상 깨끗한 상태에서 시작하므로, 이 워크플로에서 별도로 마이그레이션을 선적용할 필요가
      # 없다(예전엔 여기서 기본 .wrangler/state에 1회 적용했으나, 그 상태가 실행 간 누적되며
      # 세션 부트스트랩 IP 어뷰즈 카운터가 쌓여 반복 실행에서 blk:ip 24h 차단이 발생했다 — 그
      # 결함의 근본 수정이 이 스텝 제거다).
      - name: E2E (Chromium E1~E4 + cheat-suite)
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
