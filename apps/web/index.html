<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORLD TYPING — TypeTrip</title>
    <!-- 테마 FOUC 방지 스니펫 (docs/03 §8.1): localStorage 저장 테마를 페인트 전에 적용.
         기본값은 시스템 설정이 아니라 다크 고정(docs/01 §13.2 "다크 모드 기본, 라이트는 옵션"). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("wt:theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage 접근 불가 환경(사생활 모드 등) — 기본 다크로 진행 */
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- 폰트 프리로드 (docs/03 §8.2): Pretendard Variable subset + JetBrains Mono.
         WT-M5-01 세션 특이 조정 결과 — Pretendard는 npm 후보 두 종 모두 예산/한글 서브셋
         요건을 만족하지 못해(tooling/scripts/copy-fonts.mjs 상단 주석, 최종 보고 escalations)
         이번 태스크에서 제외하고 시스템 폰트 스택 폴백을 유지한다. JetBrains Mono만
         self-host(tooling/scripts/copy-fonts.mjs가 build/dev 전에 apps/web/public/fonts/에
         복사) — font-display: optional(globals.css @font-face)이라 늦게 도착해도 레이아웃
         튐이 없다. -->
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
