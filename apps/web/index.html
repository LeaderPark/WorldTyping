<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Android Chrome 108+ 소프트 키보드가 뷰포트를 리사이즈하도록 (docs/03 §7.1) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>TypeTrip — 세계를 타이핑하다 · Type the world</title>
    <!-- SEO/OG 정적 기본값(docs/06 §10-2, docs/00 §11-D18, WT-M6-06). 노출명은 전부 TypeTrip
         (코드네임 WORLD TYPING은 저장소/문서 전용). 이 블록은 홈("/") 및 JS 미실행 크롤러를
         위한 기본값이고, apps/web/src/app/RouteMeta.tsx가 SPA 라우트 전환마다 이 태그들을
         갱신한다(id 없이 셀렉터로 upsert하므로 아래 태그와 정확히 같은 것을 덮어쓴다). 도메인은
         하드코딩하지 않는다(§7 gotcha 7) — og:url 등 절대 URL이 필요한 태그는 RouteMeta가
         `location.origin`으로 런타임에 채운다(정적 HTML에는 넣지 않는다). -->
    <meta name="description" content="세계 지도 위 국가 이름을 타이핑하는 웹 게임. 로그인 없이 바로 플레이하세요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TypeTrip" />
    <meta property="og:title" content="TypeTrip — 세계를 타이핑하다 · Type the world" />
    <meta property="og:description" content="세계 지도 위 국가 이름을 타이핑하는 웹 게임. 로그인 없이 바로 플레이하세요." />
    <meta property="og:image" content="/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TypeTrip — 세계를 타이핑하다 · Type the world" />
    <meta name="twitter:description" content="세계 지도 위 국가 이름을 타이핑하는 웹 게임. 로그인 없이 바로 플레이하세요." />
    <meta name="twitter:image" content="/og/default.png" />
    <!-- 테마 FOUC 방지 스니펫 (docs/03 §8.1, docs/00 §11-D57): localStorage 저장 테마를 페인트
         전에 적용. 기본값은 이제 라이트 고정(D57 — 구 "다크 모드 기본"을 반전, docs/01 §13.2
         개정). 다크는 삭제되지 않고 설정에서 여전히 선택 가능(옵션으로 존치). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("wt:theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage 접근 불가 환경(사생활 모드 등) — 기본 라이트로 진행 */
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- 정적 크리티컬 셸 스타일 (docs/00 §11-D47·D57, WT-M5-01c + WT-UI-01).
         D47 실측: 지도 lazy 분리(D45) 후에도 홈 LCP가 2640ms로 불변 — LCP 요소는 CSR 첫
         페인트 자체가 아니라 S2 언어 게이트 문구였고, 게이트를 통째로 지워도 동일했다(=
         "React가 부팅해 뭔가를 그리기까지"의 JS 총비용이 상한). 그래서 #root 안에 게이트+
         히어로 타이틀을 정적 HTML/CSS로 박아 넣어 JS 실행을 기다리지 않고 즉시 페인트되게
         한다. 이 <style> 블록은 빌드 산출물이 <head>에 주입하는 컴파일된 스타일시트
         (Tailwind 등, dist/index.html 참고)의 도착도 기다리지 않도록 일부러 자체 완결시켰다
         — 색만 tokens.css 팔레트·AppShell.tsx의 bg-bg/text-text 배색에 맞추고 그 변수를
         참조하지는 않는다(리터럴 동기 관례 — D47). 셀렉터는 #wt-shell-* 전용 id/class로
         스코프해 실제 앱 클래스(.wt-home 등)와 절대 충돌하지 않는다 — React가 createRoot로
         마운트되면(아래 본문 주석) 이 스타일이 적용되던 DOM 자체가 통째로 사라지므로 핸드오프
         후엔 그냥 죽은 CSS다.

         [D57 갱신] 기본 테마가 라이트로 반전되며 body 배색 리터럴을 tokens.css의 새 --bg/--text
         라이트 값(#f4f5ef/#171b19)과 동기했다. 다크 값(#0f172a/#f8fafc)도 tokens.css
         [data-theme='dark'] --bg/--text와 동일하게 유지 — 이 파일이 바뀌면 이 리터럴도 같이
         갱신해야 한다(자동 동기 아님, 사람이 맞추는 관례).

         [WT-UI-09 갱신] D47 이후 실제 홈(HomePage/index.tsx WT-UI-04)·게이트(LanguageGateOverlay)가
         .wt-card/.wt-pill 전역 클래스로 굳어진 뒤에도 이 셸의 게이트 다이얼로그·버튼·히어로 태그라인은
         구 리터럴(#0f172a 텍스트, 0.5rem 사각 카드, 무테두리 회색 버튼, opacity 트릭 태그라인)에
         머물러 있었다 — 실제 화면과 어긋난 채로 첫 페인트를 담당하고 있었다는 뜻이라 이번에 맞춘다:
         다이얼로그는 tokens.css --text/--radius-card/--shadow-card를, 버튼은 .wt-pill(46px 필,
         accent 보더 1.5px, color-mix(accent 80%, black) 텍스트 — .wt-pill의 accent는 라이트/다크
         동일값이라 버튼 텍스트/보더 리터럴에 테마 분기가 필요 없다)을, 태그라인은 opacity 근사 대신
         --text-muted 리터럴을 그대로 베꼈다. game 로직·testid·localStorage 스크립트는 무관 — 색·형태
         리터럴만 갱신했다. -->
    <style>
      #wt-shell-hero,
      #wt-shell-gate {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      }
      body {
        margin: 0;
        background: #f4f5ef; /* = tokens.css :root --bg (라이트 기본) */
        color: #171b19; /* = tokens.css :root --text (라이트 기본) */
      }
      :root[data-theme="dark"] body {
        background: #0f172a; /* = tokens.css [data-theme='dark'] --bg */
        color: #f8fafc; /* = tokens.css [data-theme='dark'] --text */
      }
      #wt-shell-hero {
        padding: 1.5rem;
      }
      #wt-shell-hero .wt-shell-hero__title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }
      #wt-shell-hero .wt-shell-hero__tagline {
        margin: 0.25rem 0 0;
        font-size: 0.9rem;
        color: #5e645e; /* = tokens.css :root --text-muted (WT-UI-09: .wt-home__tagline과 동일 토큰) */
      }
      :root[data-theme="dark"] #wt-shell-hero .wt-shell-hero__tagline {
        color: #94a3b8; /* = tokens.css [data-theme='dark'] --text-muted */
      }
      #wt-shell-gate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6); /* = LanguageGateOverlay의 bg-black/60, 이미 동일값 */
      }
      #wt-shell-gate .wt-shell-gate__dialog {
        max-width: 24rem; /* = LanguageGateOverlay .wt-card의 max-w-sm */
        border-radius: 1rem; /* = tokens.css :root --radius-card(16px), .wt-card와 동일 */
        padding: 1.5rem;
        text-align: center;
        background: #ffffff; /* = tokens.css :root --surface */
        color: #171b19; /* = tokens.css :root --text (WT-UI-09: 구 #0f172a 오기 수정) */
        box-shadow:
          0 1px 2px rgb(23 27 25 / 0.05),
          0 8px 24px rgb(23 27 25 / 0.08); /* = tokens.css :root --shadow-card */
      }
      :root[data-theme="dark"] #wt-shell-gate .wt-shell-gate__dialog {
        background: #1e293b; /* = tokens.css [data-theme='dark'] --surface */
        color: #f8fafc; /* = tokens.css [data-theme='dark'] --text (WT-UI-09: 구 #ffffff 오기 수정) */
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.35),
          0 8px 24px rgb(0 0 0 / 0.5); /* = tokens.css [data-theme='dark'] --shadow-card */
      }
      #wt-shell-gate .wt-shell-gate__actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      /* WT-UI-09: .wt-pill(globals.css §2.3) 형태·색 그대로 — 46px 필, accent 보더, accent를
         color-mix(80%, black)로 보정한 텍스트(globals.css 주석과 동일 계산: 실측 5.32:1). accent
         (#0a84ff)는 라이트/다크 tokens.css에서 동일값이라 이 두 리터럴은 테마 분기가 필요 없다. */
      #wt-shell-gate .wt-shell-gate__btn {
        height: 46px;
        border-radius: 999px;
        border: 1.5px solid #0a84ff;
        padding: 0 1.25rem;
        font: inherit;
        font-weight: 700;
        font-size: 0.9375rem;
        background: #ffffff; /* = tokens.css :root --surface */
        color: #086acc; /* = color-mix(in srgb, #0a84ff 80%, black) */
        cursor: pointer;
      }
      :root[data-theme="dark"] #wt-shell-gate .wt-shell-gate__btn {
        background: #1e293b; /* = tokens.css [data-theme='dark'] --surface */
      }
      #wt-shell-gate .wt-shell-gate__hint {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        opacity: 0.7; /* = LanguageGateOverlay의 실제 text-xs opacity-70, 이미 동일값 */
      }
    </style>
    <!-- 폰트 프리로드 (docs/03 §8.2, docs/00 §11-D58): Pretendard 서브셋(400/700) + JetBrains Mono.
         [D58, WT-UI-01 갱신] WT-M5-01 당시엔 npm 후보 두 종 모두 예산/한글 서브셋 요건을
         만족하지 못해(tooling/scripts/copy-fonts.mjs 상단 주석) 시스템 폰트 폴백만 썼다. D58로
         이 결정을 뒤집어 tooling/scripts/build-web-fonts.mjs가 subset-font(harfbuzzjs)로 KS
         완성형 한글 + 라틴/숫자만 남긴 woff2(400/700)를 결정적으로 생성해 self-host한다.
         font-display: optional(globals.css @font-face)이라 프리로드가 늦게 도착해도 레이아웃
         튐이 없다(캐시 없으면 이번 페인트는 폴백 폰트로 확정, 다음 방문부터 적용). -->
    <link rel="preload" href="/fonts/pretendard-subset-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/pretendard-subset-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- 정적 크리티컬 셸 본문 (docs/00 §11-D47, WT-M5-01c).
           (a) 게이트: HomePage.tsx의 LanguageGateOverlay와 동일한 role/aria-label/
           data-testid(language-gate, lang-ko, lang-en) — e2e/specs/e1-first-visit.spec.ts가
           그대로 재사용한다. 문구도 packages/i18n의 lang.selectPrompt.ko/en·
           lang.selectOption.ko/en·lang.select.hint(ko+en 병기)를 그대로 복제했다 — 이
           게이트는 언어 선택 "이전" 화면이라 i18next가 아직 붙지 않은 상태이므로 두 언어
           모두 하드코딩하는 것이 유일한 선택지다(§4 "UI 문자열 하드코딩 금지" 규칙의 명시적
           예외, 이 파일 자체가 그 근거 문서다).
           (b) 히어로 타이틀: app.title/app.tagline.ko/app.tagline.en 그대로.
           React가 createRoot(rootEl).render(...)로 마운트되면(main.tsx) 기존 자식을 전부
           지우고 새로 그리므로 이 서브트리는 통째로 교체된다 — 핸드오프는 그 자연 대체가
           전부이고 별도 배선이 필요 없다. -->
      <div id="wt-shell-hero">
        <h1 class="wt-shell-hero__title">TypeTrip</h1>
        <p class="wt-shell-hero__tagline">세계를 타이핑하다 · Type the world</p>
      </div>
      <div
        id="wt-shell-gate"
        role="dialog"
        aria-modal="true"
        aria-label="language-gate"
        data-testid="language-gate"
      >
        <div class="wt-shell-gate__dialog">
          <p>어떤 언어로 여행할까요?</p>
          <p>Which language?</p>
          <div class="wt-shell-gate__actions">
            <button type="button" data-testid="lang-ko" data-wt-lang="ko" class="wt-shell-gate__btn">
              한국어로 타이핑
            </button>
            <button type="button" data-testid="lang-en" data-wt-lang="en" class="wt-shell-gate__btn">
              Type in English
            </button>
          </div>
          <p class="wt-shell-gate__hint">나중에 언제든 바꿀 수 있어요 · You can always change this later</p>
        </div>
      </div>
    </div>
    <script>
      // 정적 게이트 배선 (docs/00 §11-D47, WT-M5-01c).
      // stores/settings.ts의 hasChosenLanguage()/setLang()과 정확히 같은 localStorage 상태를
      // 기록·조회한다:
      //  1) 'wt:lang' 원시 키(hasChosenLanguage가 존재 여부만 검사) — setLang 1단계 그대로.
      //  2) 'wt:settings' — zustand persist({name:'wt:settings'}) 기본 storage(JSON
      //     localStorage) 기록 포맷 {state, version}(node_modules/zustand
      //     esm/middleware.mjs newImpl, version 미지정 시 0, merge는 {...currentState,
      //     ...persistedState} 얕은 병합). 이걸 안 쓰면 React 마운트 시 zustand 스토어가
      //     initializer의 detectDefaultLang()(navigator.language)로 lang을 다시 정해버려,
      //     여기서 고른 언어와 실제 화면 언어가 어긋난다.
      // React 마운트보다 클릭이 먼저 오면 이 스크립트가 게이트를 직접 숨긴다(자연 대체를
      // 기다릴 필요 없음) — hasChosenLanguage()가 이미 true라 React가 나중에 마운트돼도
      // LanguageGateOverlay는 처음부터 null을 반환한다(이중 게이트 없음).
      (function () {
        var gate = document.getElementById("wt-shell-gate");
        var hasChosen = false;
        try {
          hasChosen = localStorage.getItem("wt:lang") != null;
        } catch (e) {
          hasChosen = false; // 사생활 모드 등 — React 마운트 후 실제 게이트가 정상 표시된다
        }
        if (!gate) return;
        if (hasChosen) {
          gate.style.display = "none";
          return;
        }
        var buttons = gate.querySelectorAll("button[data-wt-lang]");
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].addEventListener("click", function (ev) {
            var lang = ev.currentTarget.getAttribute("data-wt-lang");
            try {
              localStorage.setItem("wt:lang", lang);
              var raw = null;
              try {
                raw = localStorage.getItem("wt:settings");
              } catch (e2) {
                raw = null;
              }
              var parsed = null;
              try {
                parsed = raw ? JSON.parse(raw) : null;
              } catch (e3) {
                parsed = null;
              }
              if (!parsed || typeof parsed !== "object") {
                parsed = { state: {}, version: 0 };
              }
              parsed.state = Object.assign({}, parsed.state, { lang: lang });
              if (typeof parsed.version !== "number") parsed.version = 0;
              localStorage.setItem("wt:settings", JSON.stringify(parsed));
            } catch (e) {
              /* localStorage 접근 불가 환경 — React 마운트 후 게이트가 정상 재표시되어 복구된다 */
            }
            gate.style.display = "none";
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
